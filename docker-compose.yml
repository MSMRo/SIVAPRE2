version: "3.8"
services:
  db:
    image: postgres:15
    container_name: sivapre_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: sivapre_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sivapre_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./sivapre-backend
    container_name: sivapre_backend
    restart: always
    env_file:
      - ./sivapre-backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./sivapre-backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
